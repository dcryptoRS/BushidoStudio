format = 2

[effect]
id = "concat.color-mixer"
name = "Color Mixer"
kind = "effect"
category = "Color"
order = 17
description = "Eight bands of hue - red, orange, yellow, green, aqua, blue, purple, magenta - each turned, saturated or brightened on its own, blending into its neighbours: the hue curves of a grading suite as sliders. Greys are left alone."

[[param]]
key = "red_hue"
group = "Red"
label = "Hue"
min = -30
max = 30
default = 0
step = 1
unit = "°"

[[param]]
key = "red_sat"
group = "Red"
label = "Saturation"
min = -100
max = 100
default = 0
step = 1
unit = "%"

