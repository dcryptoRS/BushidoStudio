[package]
name = "concat-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Concat for AI agents: an MCP server over stdio whose tools are the Concat API's methods, with schemas generated from its request types."

[dependencies]
# The one source of editing semantics. `schema` gives each request and each
# edit command its JSON Schema, which is what a tool's arguments are.
concat-api = { workspace = true, features = ["schema"] }
# The window's server, reached as a client, and the file that says where
# it is.
concat-server.workspace = true
serde_json.workspace = true
# Headless, the server sets up what the window would: decode on the video
# hardware and the user's own looks in the catalogue (Royalty Studio fork).
concat-media.workspace = true
concat-effects.workspace = true
# media_generate: the generating services, the keys the window keeps and
# the media item the result is added as (Royalty Studio fork). Already in
# the tree through concat-api.
concat-host.workspace = true
concat-project.workspace = true
# frame_levels: the preview frame's PNG read back into numbers.
base64 = "0.22"
png = "0.17"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
